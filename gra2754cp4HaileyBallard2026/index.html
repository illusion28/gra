<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Responsive Navigation | Hailey Ballard, 2026</title>
	<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style type="text/css">
body {
    margin: 0;
    background-color: rgba(199,239,165,1.00);
}
wrapper {
    margin: auto;
    width: 80%;
    display: block;
    padding: 20px;
    background-color: rgba(209,242,175,0.50);
}
section {
    height: 500px;
}
nav {
    background-color: rgba(44,75,31,1.00);
}
ul {
    padding: 0;
    margin: 0;
}
nav ul a {
    color: rgba(255,255,255,1.00);
    text-decoration: none;
    list-style-type: none;
    border-left-color: rgba(255,255,255,1.00);
    border-right-color: rgba(255,255,255,1.00);
    /* [disabled]border-bottom-color: rgba(255,255,255,1.00); */
    border-top-color: rgba(255,255,255,1.00);
    border-left-style: solid;
    border-right-style: solid;
    /* [disabled]border-bottom-style: solid; */
    border-top-style: solid;
    border-left-width: thin;
    border-right-width: thin;
    /* [disabled]border-bottom-width: thin; */
    border-top-width: thin;
}
ul a li  {
    padding: 15px;
    border-bottom: thin solid rgba(255,255,255,1.00);
}
ul a li:hover {
    background-color: rgba(143,227,138,1.00);
}
.topnav.responsive a{
    display:block;
}
.topnav.responsive a:not(:first-child) {
     display: none;
}
.topnav .fa-bars {
    display: none;
}
.topnav .fa-times {
    display: block;
}
.topnav.responsive .fa-bars {
    display: block;
}
.topnav.responsive .fa-times {
    display: none;
}
#myTopnav a {
    color: rgba(255,255,255,1.00);
}
#myTopnav {
    padding: 5px;
}
	@media (min-width:600px) {
.topnav a:not(:first-child),.topnav.responsive a:not(:first-child) {
    display:inline-block;
     }
.topnav .fa.fa-bars {
     display:none;
     }
}
</style>
	<script>
function myFunction() {
  var x = document.getElementById("myTopnav");
  if (x.className === "topnav") {
    x.className += " responsive";
  } else {
    x.className = "topnav";
  }
}
</script>
</head>

<body>
<wrapper>
  <header>
    <h1>Name of Web Site</h1>
    <nav class="topnav responsive" id="myTopnav">
		 <a href="javascript:void(0);" class="icon"
     onclick="myFunction()">
  <i class="fa fa-bars"></i><i class="fa fa-times"></i>
      <ul>
        <a href="#home"><li>Home</li></a>
       <a href="#services"> <li>Services</li></a>
        <a href="#contact"><li>Contact</li></a>
      </ul>
   </a>
			 </nav>
	  </header>
    <main>
      <section id="home">
        <h2>Home</h2>
      </section>
      <section id="services">
        <h2>Services</h2>
      </section>
      <section id="contact">
        <h2>Contact</h2>
      </section>
    </main>
    <footer></footer>
</wrapper>
</body>
</html>
