<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Tripadvisor | Hailey Ballard, 2026</title>
	<script src="https://kit.fontawesome.com/13c6897699.js" crossorigin="anonymous"></script>
<style type="text/css">
body {
    margin: 0;
    background-image: url(eiffel%20tower.jpg);
    background-size: cover;
    background-repeat: no-repeat;
    background-color: #638AD9;
    background-position: 0% 100px;
}
wrapper {
    width: 1366px;
    margin: auto;
    display: block;
}
header {
    height: 100px;
    background-color: #E5C9D9;
}
#Tabs1 ul {
    background-image: none;
    border: none;
    background-color: transparent;
}
#Tabs1 {
    background-image: none;
    background-color: rgba(255,255,255,0.50);
}
#Tabs1 ul li {
    text-align: center;
    padding-top: 0px;
    margin-top: 3px;
    margin-left: 9px;
    margin-bottom: -34px;
    margin-right: 4px;
}
#Tabs1 ul li i {
    font-size: 27px;
    color: rgba(152,111,157,1.00);
}
	#tabs-1 div{
    display: grid;
    grid-template-columns: 16% 16% 16% 16% 16% 10%;
    gap: 10px;
    margin-right: -2px;
    padding-left: 0px;
    padding-top: 0px;
	}
.search {
    background-color: rgba(69,187,243,1.00);
    color: rgba(11,48,72,1.00);
}
h1 {
    padding: 20px;
    margin: 0;
	 font-family: "Zilla Slab", serif;
}
input, select {
    border-radius: 10px;
    padding: 10px;
}
	#tabs-2 div{
		display:grid;
		grid-template-columns: 20% 20% 20% 10%;
		gap:10px;
	}
		#tabs-3 div{
		display:grid;
		grid-template-columns: 12% 12% 12% 12% 12% 12% 10%;
		gap:10px;
	}
		#tabs-4 div{
		display:grid;
		grid-template-columns: 20% 20% 20% 10%;
		gap:10px;
	}
		#tabs-5 div{
		display:grid;
		grid-template-columns: 30% 30% 10%;
		gap:10px;
	}
	p{
    font-family: "Gelasio", serif;
    font-style: italic;
    font-variant: normal;
    font-weight: bold;
    font-size: 29px;
    padding-top: 8px;
	}
</style>
<link href="jQueryAssets/jquery.ui.core.min.css" rel="stylesheet" type="text/css">
<link href="jQueryAssets/jquery.ui.theme.min.css" rel="stylesheet" type="text/css">
<link href="jQueryAssets/jquery.ui.tabs.min.css" rel="stylesheet" type="text/css">
<script src="jQueryAssets/jquery-1.11.1.min.js"></script>
<script src="jQueryAssets/jquery.ui-1.10.4.tabs.min.js"></script>
</head>

<body>
<header>
	<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
	<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <wrapper>
    <h1>Tripadvisor</h1>
  </wrapper>
</header>
<wrapper>
  <div id="Tabs1">
    <ul>
      <li><a href="#tabs-1"><i class="fa-solid fa-plane"></i><br>
Flights</a></li>
      <li><a href="#tabs-2"><i class="fa-solid fa-hotel"></i><br>
Hotels</a></li>
      <li><a href="#tabs-3"><i class="fa-solid fa-car-tunnel"></i><br>
Cars</a></li>
      <li><a href="#tabs-4"><i class="fa-solid fa-suitcase-rolling"></i><br>
Packages</a></li>
      <li><a href="#tabs-5"><i class="fa-solid fa-umbrella-beach"></i><br>
Activities</a></li>
    </ul>
    <div id="tabs-1">
      <p>Find your flights</p>
      <div>
        <input type="text" placeholder="Leaving from">
        <input type="text" placeholder="Going to"><input type="date"><input type="date"><select>
          <option value="0">Number of travelers</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          </select><input type="submit" class="search" value="Search">
      </div>
    </div>
<div id="tabs-2">
      <p>Find your hotels</p>
      <div>
	<input type="text" placeholder="Going to"><input type="date"><select>
          <option value="0">Number of travelers</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          </select><input type="submit" class="search" value="Search">
	</div>	
  </div>
<div id="tabs-3">
      <p>Find your car rental</p>
      <div>
	<input type="text" placeholder="Pick-up">
        <input type="text" placeholder="Same as pick-up"><input type="date"><input type="date">
	<select>
          <option value="0">Pick-up time</option>
          <option value="1">10:30am</option>
          <option value="2">11:00am</option>
          <option value="3">11:30am</option>
          <option value="4">12:00pm</option>
          <option value="5">12:30pm</option>
          </select>
		  <select>
          <option value="0">Drop-off time</option>
          <option value="1">10:30pm</option>
          <option value="2">11:00am</option>
          <option value="3">11:30am</option>
          <option value="4">12:00pm</option>
          <option value="5">12:30pm</option>
          </select>
		  <input type="submit" class="search" value="Search">
	</div>
  </div>
<div id="tabs-4">
  <p>Bundle and save</p>
      <div>
	<input type="text" placeholder="Where to?"><input type="date">
	<select>
          <option value="0">Number of travelers</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          </select><input type="submit" class="search" value="Search">
	</div>
  </div>
<div id="tabs-5">
  <p>Find things to do</p>
      <div>
	<input type="text" placeholder="Going to"><input type="date"><input type="submit" class="search" value="Search">
	</div>
  </div>
</wrapper>
<script type="text/javascript">
$(function() {
	$( "#Tabs1" ).tabs(); 
});
</script>
</body>
</html>
